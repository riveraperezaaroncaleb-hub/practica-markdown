<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" role="img" aria-labelledby="title">
  <title id="title">Diagrama de arquitectura de la Intranet Escolar</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#5a6677"/>
    </marker>
  </defs>

  <text x="30" y="40" font-family="Arial" font-size="16" font-weight="bold" fill="#1a2332">Arquitectura del prototipo</text>

  <text x="30" y="80" font-family="Arial" font-size="13" font-weight="bold" fill="#5a6677">Usuarios por rol</text>
  <rect x="30" y="95" width="160" height="50" rx="8" fill="#e7f0fb" stroke="#0b5cad"/>
  <text x="110" y="124" text-anchor="middle" font-family="Arial" font-size="13" fill="#084a8f">Administración</text>
  <rect x="30" y="155" width="160" height="50" rx="8" fill="#e7f0fb" stroke="#0b5cad"/>
  <text x="110" y="184" text-anchor="middle" font-family="Arial" font-size="13" fill="#084a8f">Docentes</text>
  <rect x="30" y="215" width="160" height="50" rx="8" fill="#e7f0fb" stroke="#0b5cad"/>
  <text x="110" y="244" text-anchor="middle" font-family="Arial" font-size="13" fill="#084a8f">Estudiantes / Familias</text>

  <line x1="190" y1="160" x2="270" y2="160" stroke="#5a6677" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="280" y="95" width="220" height="180" rx="10" fill="#ffffff" stroke="#d3d9e3" stroke-width="2"/>
  <text x="390" y="122" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1a2332">Aplicación (navegador)</text>
  <text x="300" y="150" font-family="Arial" font-size="12" fill="#5a6677">- index.html</text>
  <text x="300" y="172" font-family="Arial" font-size="12" fill="#5a6677">- css/style.css</text>
  <text x="300" y="194" font-family="Arial" font-size="12" fill="#5a6677">- js/app.js (ruteo)</text>
  <text x="300" y="216" font-family="Arial" font-size="12" fill="#5a6677">- js/views.js (vistas)</text>
  <text x="300" y="238" font-family="Arial" font-size="12" fill="#5a6677">- js/auth.js (RBAC)</text>
  <text x="300" y="260" font-family="Arial" font-size="12" fill="#5a6677">- js/data.js (persistencia)</text>

  <line x1="500" y1="160" x2="580" y2="160" stroke="#5a6677" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="590" y="95" width="200" height="90" rx="10" fill="#ffffff" stroke="#d3d9e3" stroke-width="2"/>
  <text x="690" y="122" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1a2332">Capa de datos</text>
  <text x="600" y="148" font-family="Arial" font-size="12" fill="#5a6677">localStorage del navegador</text>
  <text x="600" y="168" font-family="Arial" font-size="12" fill="#5a6677">usuarios · materias · notas</text>

  <rect x="590" y="215" width="200" height="60" rx="10" fill="#f8e0e2" stroke="#a11b28"/>
  <text x="690" y="242" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#a11b28">Hash SHA-256 + sal</text>
  <text x="690" y="262" text-anchor="middle" font-family="Arial" font-size="11" fill="#a11b28">contraseñas nunca en texto plano</text>
</svg>
